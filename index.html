<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile</title>
  <link rel="stylesheet" href="./CSS/style.css" />
</head>
<body>
  <header>
    <div class="container header-container">
      <h1>My Profile</h1>
      <nav>
        <ul>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#works">Works</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="main-visual">
    <img src="images/main.png" alt="メインビジュアル">
  </div>

  <section id="about">
    <div class="container">
      <h2>About</h2>
      <div class="about-content">
        <img src="images/about.png" alt="プロフィール写真">
        <div class="text">
          <p><strong>Kazuki Asahina</strong></p>
          <ul>
            <li>25歳 長野県佐久市出身</li>
            <li>ソフトウェア業界でマーケティングに従事</li>
            <li>趣味はカメラ。愛機はCanon</li>
            <li>自然を撮影するのが好きで、海や山によく行く</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section id="works">
    <div class="container">
      <h2>Works</h2>
      <div class="works-list">
        <div class="work-item">
          <img src="images/works1.png" alt="日本海の写真">
          <p>新潟に訪れた際に、日本海の雄大さを魅了されて撮影した1枚</p>
        </div>
        <div class="work-item">
          <img src="images/works2.png" alt="木曽町の写真">
          <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
        </div>
        <div class="work-item">
          <img src="images/works3.png" alt="京都の町並みの写真">
          <p>京都で撮影した、明け方の古き良き日本の町並み</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p>© MyProfile. All rights reserved.</p>
  </footer>
</body>
</html>
