<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="自己紹介と写真作品を掲載しているサイトです。">
    <title>MyProfile</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- ヘッダー -->
    <header>
      <div>
        <h1>My Profile</h1>
        <!-- ナビゲーションメニュー -->
        <nav>
          <div id="nav-pc">
            <a href="index.html#about">About</a>
            <a href="index.html#works">Works</a>
          </div>
        </nav>
      </div>
    </header>
    
    <main>
      <article>
        <!--Main Visual-->
        <div>
          <img src="images/main.png" alt="CanonのCamera" class="mv">
        </div>

        <!-- About -->
        <section class="about">
          <h2 id="about">About</h2>
          <div class="about-box">
            <img src="images/about.png" alt="Kazuki Asahina" class="profile-img">
            <div class="intorduction">
              <p>Kazuki Asahina</p>
              <ul>
                <li>25歳 長野県佐久市出身</li>
                <li>ソフトウェア業界でマーケティングに従事</li>
                <li>趣味はカメラ、愛機はCanon</li>
                <li>自然を撮影するのが好きで、海や山によく行く</li>
              </ul>
            </div>
          </div>
        </section>

        <!-- Works -->
        <section class="works">
          <h2 id="works">Works</h2>
          <div class="works-contents">
            <div>
              <img src="images/works1.png" alt="日本海">
              <p>新潟に訪れた際に、日本海の雄大さを魅了されて撮影した1枚</p>
            </div>
            <div>
              <img src="images/works2.png" alt="冠雪した御嶽山">
              <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
            </div>
            <div>
              <img src="images/works3.png" alt="京都の街並み">
              <p>京都で撮影した、明け方の古き良き日本の町並み</p>
            </div>
          </div>
        </section>
      </article>
    </main>

    <!-- フッター -->
    <footer>
      <p> &copy; MyProfile. All rights reserved.</p>
    </footer>
  </body>
</html>
